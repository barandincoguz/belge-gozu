name: ci

# Kapsam kararı (2026-08-31 proje denetimi, bulgu C12): eski iş akışı
# `uv sync --extra dev` diyordu — lock DİSİPLİNİ yoktu (kilit dosyası
# sürüklenirse CI yeşil kalır, dağıtım anında `uv export --frozen` patlardı) ve
# imaj hiç build edilmiyordu, yani dağıtım zinciri bir kez bile doğrulanmamıştı.
# Artık iki iş var: hızlı `test` (lint + testler + veri bütünlüğü) ve `docker`
# (imajın gerçekten kurulabildiğinin kanıtı).
#
# `ml` extra'sı (torch, colpali-engine) testlerde BİLİNÇLİ olarak kurulmaz:
# `-m "not slow"` süiti modeli stub'lar, ağır tekerlekleri indirmek CI'ı
# dakikalarca uzatır. Gerçek `ml` kurulumu `docker` işinde frozen `uv sync`
# ile doğrulanır.

on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # --locked: pyproject ile uv.lock ayrışmışsa CI KIRMIZI olur (sessizce
      # çözüp devam etmez) — Dockerfile'daki `uv sync --frozen` ile simetri.
      - run: uv sync --locked --extra dev
      - run: make lint
      - run: make test
      # Cevaplanamaz set makine kapısı: çapaların "korpusta yok" iddiası,
      # dilim sayıları, split türetimi ve yakın-tekrarlar (bkz.
      # data/bench/unans_v1.README.md). Model/ağ gerektirmez.
      - name: cevaplanamaz veri kümesi doğrulaması
        run: uv run python scripts/validate_unans.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: imaj build (dağıtım zinciri kanıtı)
        run: docker build -t belge-gozu:ci .
      - name: root olmayan kullanıcı ve yazılabilir veri yolları
        run: >-
          docker run --rm --entrypoint sh belge-gozu:ci -c
          'test "$(id -u)" = 1000 && test -w /data && test -w /data/hf'
      - name: Linux imajı CPU-only PyTorch kullanıyor
        run: >-
          docker run --rm --entrypoint python belge-gozu:ci -c
          'import torch; assert "+cpu" in torch.__version__, torch.__version__'
      - name: sabitlenmemiş Hub revision fail-fast
        run: |
          set +e
          output=$(docker run --rm -e BG_HF_REVISION= belge-gozu:ci 2>&1)
          status=$?
          set -e
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -q 'BG_HF_REVISION'
      - name: ağsız üretim fabrikası sağlık smoke testi
        run: |
          container=$(docker run --rm -d -p 7860:7860 --entrypoint python \
            belge-gozu:ci scripts/docker_smoke.py)
          cleanup() {
            docker logs "$container" || true
            docker stop "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if body=$(curl --fail --silent http://127.0.0.1:7860/healthz); then
              break
            fi
            sleep 1
          done
          test -n "${body:-}"
          BODY="$body" python -c \
            'import json, os; payload=json.loads(os.environ["BODY"]); assert payload["status"] == "ok"'
