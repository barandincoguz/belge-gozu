[project]
name = "belge-gozu"
version = "0.1.0"
description = "Visual document RAG for Turkish legal documents"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "httpx>=0.27",
  "certifi>=2024.0.0",
  "pymupdf>=1.24",
  "pillow>=10.0",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "typer>=0.12",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "huggingface-hub>=0.24",
  "google-genai>=1.0",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
# colpali-engine PIN'LI (aralık değil): prompt-format sözleşmesi 0.3.18
# davranışına karşı doğrulandı (T11/Step 1 — visual_prompt_prefix ClassVar'ı
# 0.3.11'de, "Query: " prefix'i 0.3.13'te değişti). Manifest engine sürümünü
# KAYDEDER ama uyumluluk kontrolünde KARŞILAŞTIRMAZ; asıl kilit bu pin.
# D2 ile `transformers` ve `safetensors` artık DOĞRUDAN bağımlılık (ColBERT
# kodlama sözleşmesi), transitive değil — beyan edilmezse bir colpali-engine
# yükseltmesi onları sessizce değiştirebilir.
#
# `pylate` BİLEREK YOK: kurulumu torch 2.13->2.11 ve transformers 5.15->5.3
# düşürüyor (fast-plaid `torch==2.11.0` tam pinliyor). Bu bir çakışma değil,
# revalidasyon bedeli: colpali-engine==0.3.18 pini MEVCUT yığın altında
# doğrulandı. Karşılığı `index/colbert_encode.py`de ~120 satır.
ml = [
  "colpali-engine==0.3.18",
  "torch>=2.4",
  "transformers>=5.3,<6",
  "safetensors>=0.6",
]
dev = ["pytest>=8.0", "ruff>=0.6", "pyright>=1.1.380", "pre-commit>=3.8"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
belge-gozu = "belge_gozu.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/belge_gozu"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: gerçek model/ağ gerektirir; CI'da koşmaz"]
filterwarnings = [
  "ignore:builtin type Swig:DeprecationWarning",
  "ignore:builtin type swigvarlink:DeprecationWarning",
  # bu filterwarnings bloğu eklenince pytest'in uyarı kayıt önbelleği sıfırlanıyor
  # ve daha önce sessizce yutulan şu üçüncü-taraf uyarısı da görünür hale geliyor
  # (davranış değişikliği değil, yalnız görünürlük); fastapi/starlette sürümü
  # yükseltilene kadar bastırılıyor.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]
